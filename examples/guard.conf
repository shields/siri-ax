# siri-ax guard configuration. Every phrase must match one `allow` pattern in full;
# with no `allow` lines every phrase is refused.
#
# Format: one `key = value` per line. Blank lines and lines starting with # are ignored.
# Keys:
#   allow      a regular expression (ICU syntax), matched against the whole phrase,
#              case-insensitively, after leading and trailing spaces are removed.
#              Repeatable.
#   max_length longest phrase in characters, 1 to 200. Default 100.
#   non_ascii  allow or deny. Default deny.

max_length = 60

# "set lamp to red", "set the lamp to 50%", "set lamp to cool white".
# The value is a closed list. Do not end an allow pattern with free text such as
# [a-z ]+: "red and call Mom" would pass and reach Siri as part of the request.
allow = set (the )?lamp to (red|orange|yellow|green|blue|purple|pink|(cool |warm |neutral )?white|on|off|[0-9]{1,3}%)
